[project]
name = "diffkalman"
version = "0.1.0"
description = "Batched, differentiable Extended Kalman Filter in PyTorch: learn physical constants by backpropagating through the filter."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy", "matplotlib"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = ["ignore::FutureWarning:torch._inductor"]
